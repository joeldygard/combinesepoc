    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Neither webfont stylesheet blocks first paint. media="print" keeps each
      one off the critical path and the onload swap promotes it the instant it
      lands; the preload below is what makes that fast rather than merely late,
      fetching the primary face at high priority while no longer holding up the
      paint. Both URLs already carry display=swap, so the fallback stack renders
      immediately and the swap is invisible on a warm connection.

      Measured: 616ms -> 348ms FCP (median of 5, 4x CPU throttle, 9Mbps/60ms,
      350ms cold-origin latency). The floor with no webfont at all is 324ms.

      The <noscript> copy below restores blocking loads when the onload swap
      cannot run, so a JS-off visitor still gets the real typefaces.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      />
    </noscript>
